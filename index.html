<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pack Réussite BAC 2026</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f4f6f9;
    text-align:center;
}

header{
    background:#002147;
    color:white;
    padding:30px;
}

.section{
    margin:30px;
    padding:20px;
    background:white;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
button{
    padding:10px 20px;
    background:#002147;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
button:hover{
    background:#001530;
}
.price{
    color:#ff9800;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>🎓 Pack Réussite BAC 2026</h1>
<p>Terminale D & Terminale A – Burkina Faso</p>
</header>

<div class="section">
<h2>📘 Terminale D</h2>
<p>✔ Maths</p>
<p>✔ Physique</p>
<p>✔ SVT</p>
<p class="price">Prix : 3000 FCFA</p>
<button onclick="verifierD()">Accéder au Pack D</button>
</div>

<div class="section">
<h2>📕 Terminale A</h2>
<p>✔ Philosophie</p>
<p>✔ Histoire</p>
<p>✔ Français</p>
<p class="price">Prix : 3000 FCFA</p>
<button onclick="verifierA()">Accéder au Pack A</button>
</div>

<script>
function verifierD(){
    var password = prompt("Mot de passe Terminale D :");
    if(password === "D2026"){
        alert("Accès autorisé au Pack D ✅");
    }else{
        alert("Mot de passe incorrect ❌");
    }
}

function verifierA(){
    var password = prompt("Mot de passe Terminale A :");
    if(password === "A2026"){
        alert("Accès autorisé au Pack A ✅");
    }else{
        alert("Mot de passe incorrect ❌");
    }
}
</script>

</body>
</html>
